<style>
:root{
  --bg:#07070d;
  --fill:#101018;
  --border:rgba(255,255,255,.09);
  --text:#eef0f6;
  --muted:#8b93a7;
  --fn:#635bff;        /* FundedNext brand purple */
  --fn-soft:#a5a1ff;
  --btn-h:58px;
  /* vertical sizes scale with the visible screen height (svh = with the browser bars showing),
     so the whole page, both feature buttons included, fits on one screen down to ~550px tall */
  --vh:1vh;
  --avatar-max:124px;
  --profile-gap:34px;
}
@supports (height:1svh){:root{--vh:1svh}}
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
  -webkit-tap-highlight-color:transparent;
}
img{display:block;max-width:100%}
a{color:inherit}

.page{
  min-height:100vh;
  min-height:100svh; /* accounts for mobile browser chrome */
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:
    max(clamp(20px, calc(var(--vh) * 6.6), 56px), env(safe-area-inset-top))
    max(18px, env(safe-area-inset-right))
    max(clamp(20px, calc(var(--vh) * 5.6), 48px), env(safe-area-inset-bottom))
    max(18px, env(safe-area-inset-left));
}

/* PROFILE */
.profile{display:flex;flex-direction:column;align-items:center;text-align:center;margin-bottom:clamp(18px, calc(var(--vh) * 4.4), var(--profile-gap))}
.avatar{
  --size:clamp(84px, calc(var(--vh) * 15), var(--avatar-max));
  width:var(--size);height:var(--size);border-radius:50%;
  padding:4px;
  border:1px solid transparent;
  background:linear-gradient(var(--bg),var(--bg)) padding-box,
             linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.08) 55%,rgba(255,255,255,.3)) border-box;
  margin-bottom:clamp(12px, calc(var(--vh) * 2.4), 20px);
}
.avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.profile h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:clamp(1.85rem,7.4vw,2.35rem);
  font-weight:700;letter-spacing:-.02em;line-height:1.1;
}

/* LINKS */
.links{width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}

/* same button language as cooperpaixao.com: solid fill on padding-box, brand gradient on border-box */
.btn{
  --grad:linear-gradient(135deg,rgba(255,255,255,.3),rgba(255,255,255,.08));
  --glow:rgba(255,255,255,.16);
  --inner:rgba(255,255,255,.07);  /* inner glow, left half */
  --inner2:var(--inner);          /* inner glow, right half */
  --ico:var(--text);
  display:flex;align-items:center;justify-content:center;gap:10px;
  width:100%;height:var(--btn-h);
  padding:0 18px;border-radius:14px;
  border:1px solid transparent;
  background:
    radial-gradient(75% 150% at 25% 135%,var(--inner),transparent 70%) padding-box,
    radial-gradient(75% 150% at 75% 135%,var(--inner2),transparent 70%) padding-box,
    linear-gradient(var(--fill),var(--fill)) padding-box,
    var(--grad) border-box;
  color:var(--text);text-decoration:none;
  font:500 1rem/1 'Inter',sans-serif;
  cursor:pointer;
  transition:transform .18s ease,box-shadow .18s ease;
}
.btn svg{width:21px;height:21px;flex-shrink:0;color:var(--ico)}
.btn:focus-visible{outline:2px solid var(--fn-soft);outline-offset:3px}
.btn:active{transform:scale(.985)}
@media (hover:hover){
  .btn:hover{transform:translateY(-3px);box-shadow:0 10px 28px var(--glow)}
}

.btn-tt{
  --grad:linear-gradient(135deg,#25f4ee,#6b7488 50%,#fe2c55);
  --glow:rgba(37,244,238,.2);
  --inner:rgba(37,244,238,.15);--inner2:rgba(254,44,85,.16);
}
.btn-ig{
  --grad:linear-gradient(135deg,#feda75,#d62976 45%,#833ab4);
  --glow:rgba(214,41,118,.3);
  --inner:rgba(214,41,118,.18);--inner2:rgba(131,58,180,.2);
  --ico:#f0568f;
}
.btn-mail{--grad:linear-gradient(135deg,#fff,#7d8496);--glow:rgba(255,255,255,.18)}

.btn .verified{width:17px;height:17px;margin-left:-4px}

/* FEATURE BUTTONS (Discord, FundedNext): double height, a headline over a subline,
   brand glow from below and a light sweep on hover */
.btn-feature{
  --feat-fill:#0b0a1a;
  --feat-glow:rgba(99,91,255,.34);
  --sweep:rgba(165,161,255,.16);
  --sub:#b9b6e6;
  position:relative;overflow:hidden;isolation:isolate;
  flex-direction:column;gap:12px;
  height:auto;
  min-height:clamp(calc(var(--btn-h) * 1.5), calc(var(--vh) * 13.4), calc(var(--btn-h) * 2));
  padding-block:10px;
  border-radius:18px;
  background:
    radial-gradient(120% 140% at 50% 120%,var(--feat-glow),transparent 60%) padding-box,
    linear-gradient(var(--feat-fill),var(--feat-fill)) padding-box,
    var(--grad) border-box;
}
/* set the feature pair apart from the plain buttons above */
.btn:not(.btn-feature) + .btn-feature{margin-top:10px}
.btn-feature .sub{font-size:.86rem;font-weight:500;color:var(--sub);letter-spacing:.01em}
.btn-feature .sub b{font-family:'Space Grotesk',sans-serif;font-weight:700;color:#fff}
.btn-feature::after{
  content:'';position:absolute;inset:0;z-index:-1;
  background:linear-gradient(105deg,transparent 35%,var(--sweep) 50%,transparent 65%);
  transform:translateX(-100%);
}
@media (hover:hover){
  .btn-feature:hover::after{transform:translateX(100%);transition:transform .75s ease}
}

/* DISCORD: icon + headline, invite link underneath */
.btn-feature.btn-dc{
  --grad:linear-gradient(135deg,#b5baff,#5865f2 35%,#232861 65%,#8e96ff);
  --glow:rgba(88,101,242,.38);
  --feat-fill:#0a0b1c;
  --feat-glow:rgba(88,101,242,.36);
  --sweep:rgba(158,165,255,.16);
  --sub:#b4b9e8;
  --ico:#8b94ff;
}
.btn-dc .headline{
  display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 11px;
  font:600 clamp(1.06rem,4.9vw,1.24rem)/1.1 'Space Grotesk',sans-serif;
  letter-spacing:-.01em;text-align:center;text-wrap:balance;
}
.btn-dc .headline svg{width:30px;height:30px}
.btn-dc .sub b{letter-spacing:.02em}

/* FUNDEDNEXT: logo + code (the link auto-applies GEOO) */
.btn-feature.btn-fn{
  --grad:linear-gradient(135deg,#b3afff,var(--fn) 35%,#231f63 65%,#8f89ff);
  --glow:rgba(99,91,255,.38);
}
.btn-fn img{width:min(78%,290px);height:auto}
.btn-fn .sub b{letter-spacing:.12em}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* staggered entrance; backwards fill so hover transforms still work once it ends */
.rise{animation:rise .6s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){
  .rise{animation:none}
  .btn,.btn-feature::after,.btn-feature:hover::after{transition:none}
}

@media (min-width:600px){
  :root{--btn-h:60px;--avatar-max:136px;--profile-gap:38px}
}
@media (max-width:350px){
  :root{--btn-h:54px;--avatar-max:108px}
  .btn{font-size:.94rem}
}
@media (max-width:310px){
  .btn-dc .headline{font-size:.9rem;column-gap:8px}
  .btn-dc .headline svg{width:24px;height:24px}
}
/* short screens (iPhone SE, Safari with its bars showing, small laptops, landscape):
   slimmer buttons so everything still fits on one screen; comes last so it wins over the width rules */
@media (max-height:700px){
  :root{--btn-h:52px}
  .links{gap:10px}
}
</style>
</head>
